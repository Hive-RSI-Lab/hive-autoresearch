<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="system-ui,sans-serif" font-size="12">
<rect width="720" height="380" fill="#fcfcfb"/>
<text x="64" y="22" font-size="14" fill="#0b0b0b">CPU seconds of go test -short ./internal/gocache (value, lower is better)</text>
<line x1="64" x2="696" y1="332.0" y2="332.0" stroke="#e6e5e0"/>
<text x="56" y="336.0" text-anchor="end" fill="#898781">0</text>
<line x1="64" x2="696" y1="265.0" y2="265.0" stroke="#e6e5e0"/>
<text x="56" y="269.0" text-anchor="end" fill="#898781">4030</text>
<line x1="64" x2="696" y1="198.0" y2="198.0" stroke="#e6e5e0"/>
<text x="56" y="202.0" text-anchor="end" fill="#898781">8061</text>
<line x1="64" x2="696" y1="131.0" y2="131.0" stroke="#e6e5e0"/>
<text x="56" y="135.0" text-anchor="end" fill="#898781">12091</text>
<line x1="64" x2="696" y1="64.0" y2="64.0" stroke="#e6e5e0"/>
<text x="56" y="68.0" text-anchor="end" fill="#898781">16121</text>
<text x="64.0" y="350" text-anchor="middle" fill="#898781">0</text>
<text x="169.3" y="350" text-anchor="middle" fill="#898781">1</text>
<text x="274.7" y="350" text-anchor="middle" fill="#898781">2</text>
<text x="380.0" y="350" text-anchor="middle" fill="#898781">3</text>
<text x="485.3" y="350" text-anchor="middle" fill="#898781">4</text>
<text x="590.7" y="350" text-anchor="middle" fill="#898781">5</text>
<text x="696.0" y="350" text-anchor="middle" fill="#898781">6</text>
<text x="380.0" y="370" text-anchor="middle" fill="#52514e">experiment</text>
<polyline fill="none" stroke="#2a78d6" stroke-width="2" points="64.0,83.9 274.7,83.9 274.7,141.4 380.0,141.4 380.0,190.8 696.0,190.8 696.0,221.8 696.0,221.8"/>
<circle cx="64.0" cy="83.9" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>#0 baseline: 14927.0  - baseline</title></circle>
<circle cx="169.3" cy="102.0" r="5" fill="#fcfcfb" stroke="#898781" stroke-width="2"><title>#1 no: 13838.0  - inner go test -vet=off: a cold cache runs vet over every stdlib dependency for facts; the test is about cache reuse, not vet</title></circle>
<circle cx="274.7" cy="141.4" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>#2 yes: 11463.0  - cheapest inner build: -vet=off, -gcflags=all=-N -l (no optimising/inlining), -ldflags=-s -w, CGO_ENABLED=0; the cold first run compiles testing's whole stdlib</title></circle>
<circle cx="380.0" cy="190.8" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>#3 yes: 8496.0  - less work per compile: -gcflags adds -dwarf=false (the compiler makes no DWARF the stripped link drops anyway), GOGC=400 for the compile/link processes</title></circle>
<circle cx="485.3" cy="202.1" r="5" fill="#fcfcfb" stroke="#898781" stroke-width="2"><title>#4 no: 7815.0  - -gcflags adds -c=1: the compiler's concurrent backend costs CPU in goroutine handoff on functions this small; go test already compiles packages in parallel</title></circle>
<circle cx="590.7" cy="208.2" r="5" fill="#fcfcfb" stroke="#898781" stroke-width="2"><title>#5 no: 7448.0  - try 4's -c=1 (+8%, under the margin alone) with GOGC=1000 for the compile/link processes, both cutting runtime overhead in the compiler</title></circle>
<circle cx="696.0" cy="221.8" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>#6 yes: 6628.0  - less runtime overhead in 131 short tool processes: -c=1, GOGC=off, GOMAXPROCS=4 (fewer idle Ps spinning per compile; go test -p becomes 4)</title></circle>
<circle cx="64" cy="40" r="5" fill="#2a78d6"/><text x="74" y="44" fill="#52514e">kept (line: best so far)</text>
<circle cx="224" cy="40" r="5" fill="#fcfcfb" stroke="#898781" stroke-width="2"/><text x="234" y="44" fill="#52514e">reverted</text>
</svg>
